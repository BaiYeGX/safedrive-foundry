# G1-06 frozen multi-rate control baseline. G1-08 compares against this hash.

[baseline]
name = "mpc_pid_fixed_v1"
schema_version = "safedrive.g1_06.control.v1"
profile = "control_50hz"
control_period_ms = 20.0
deadline_ms = 20.0

[vehicle]
wheelbase_m = 2.8
max_speed_mps = 15.0
max_steer_rad = 0.6
max_accel_mps2 = 2.5
max_brake_mps2 = 4.0
steer_deadzone_rad = 0.01
throttle_deadzone = 0.02

[mpc]
horizon = 10
dt_s = 0.02
w_cte = 4.0
w_heading = 2.0
w_speed = 1.0
w_steer = 0.5
w_accel = 0.3
w_dsteer = 0.2
max_iterations = 15
solver_tolerance = 1e-4
warm_start = true
wall_budget_ms = 12.0

[fallback]
chain = ["mpc", "lqr", "pure_pursuit", "pid", "brake"]
stale_trajectory_s = 0.2

[pid]
kp_speed = 1.2
ki_speed = 0.1
kd_speed = 0.05
kp_steer = 1.5
kd_steer = 0.1

[pure_pursuit]
lookahead_m = 6.0
min_lookahead_m = 2.0

[lqr]
q_cte = 5.0
q_heading = 3.0
q_speed = 1.0
r_steer = 0.4
r_accel = 0.2
