[profile.throughput_20hz]
synchronous_mode = true
substepping = true
fixed_delta_seconds = 0.05
max_substep_delta_time = 0.01
max_substeps = 5
control_period_ms = 50

# Exclusive H6-CORA data collection profile.  It deliberately has the same
# deterministic physics cadence as the proven H2/H3 collector, but a distinct
# profile identity so admission/run-lock evidence cannot confuse a CORA run
# with an older paired-outcome workload.
[profile.cora_data]
synchronous_mode = true
substepping = true
fixed_delta_seconds = 0.05
max_substep_delta_time = 0.01
max_substeps = 5
control_period_ms = 50

[profile.control_50hz]
synchronous_mode = true
substepping = true
fixed_delta_seconds = 0.02
max_substep_delta_time = 0.01
max_substeps = 2
control_period_ms = 20
