# R2 / G4A Scenario Registry V1
# Snapped to Town03 driving waypoints BEFORE outcome observation.
# Exact spawn only; simulation-time actor scripts; no free/fallback spawn.

[registry]
schema_version = "safedrive.g4a.scenario_registry.v1"
registry_version = "v1"
description = "R2 pilot: lead braking / cut-in / crossing on Town03 roads"

[defaults]
map_name = "Town03"
sim_dt_s = 0.05
duration_s = 5.0
vla_config_ref = "config/vla/k2_v1.toml"
mpc_config_ref = "config/control/mpc_pid_baseline.toml"
executor_config_ref = "g3_stable_vla_mpc"
expected_decision_anchor_time_s = 0.0

[defaults.weather]
preset = "ClearNoon"
cloudiness = 10.0
precipitation = 0.0
precipitation_deposits = 0.0
wind_intensity = 5.0
sun_azimuth_angle = 0.0
sun_altitude_angle = 70.0
wetness = 0.0
fog_density = 0.0
fog_distance = 0.0

[defaults.traffic_light]
policy = "freeze_green"
initial_state = "Green"

[defaults.sensor_contract.front_rgb]
width = 1024
height = 512
fov = 110.0
attach = "ego"
layout = "HWC_RGB_uint8"


