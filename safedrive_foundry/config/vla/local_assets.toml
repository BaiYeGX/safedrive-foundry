[carla]
expected_version = "0.9.16"
windows = "E:\\CARLA_0.9.16"
wsl = "/mnt/e/CARLA_0.9.16"
windows_executable = "E:\\CARLA_0.9.16\\CarlaUE4.exe"
wsl_executable = "/mnt/e/CARLA_0.9.16/CarlaUE4.exe"
