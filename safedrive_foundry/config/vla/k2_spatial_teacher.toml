# X5C defensive teacher config (R2-X repair B)
# Student must never consume privileged fields from this file's selection path.

schema_version = "safedrive.k2_spatial_teacher.v4"
teacher_id = "spatial_defensive_lattice_v4_legal_pool"
# Production dataset-v5 builders MUST set true and pass execution_filters
# Production default: true. Unit tests must pass TeacherConfig(require_execution_filters=False).
require_execution_filters = true

d_peaks_m = [-1.0, -0.7, -0.4, 0.0, 0.4, 0.7, 1.0]
speed_scales = [0.70, 0.85, 1.00]
side_shift_start_s = [0.30, 0.40]
side_shift_recover_s = [0.75, 0.90]
preserve_nav_corridor = true
preserve_terminal_semantics = true

filter_order = [
  "corridor_monotonic_s_continuity",
  "direction_away_from_conflict",
  "lead_no_forced_swerve",
  "guard_v2",
  "path_manager_densify_accepted",
  "steer_curvature_gate",
  "mpc_rollout_30tick",
  "privileged_cost",
]

[privileged_cost]
collision_invalid = true
prefer_higher_ttc = true
prefer_higher_clearance = true
prefer_progress = true
prefer_lower_jerk = true
prefer_lower_over_lateral = true

[availability]
require_legal = true
require_strictly_better_than_nominal = true
forbid_empty_road_forced_swerve = true
min_lateral_sep_m = 0.5
better_margin_ttc_s = 0.25
better_margin_clearance_m = 0.30

[mpc_rollout]
horizon_ticks = 30
require_all_solved = true
forbid_fallback = true
